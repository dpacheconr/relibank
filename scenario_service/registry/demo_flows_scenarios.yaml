# Registry of demo_flows/<scenario>/act-N-* scenarios wired into the
# scenario runner as generic "script" type entries. Each entry's trigger.sh
# is the single source of truth for behavior — this file only tells the
# runner where to find it and how to present its actions in the UI.
#
# actions[].verb    must match a case arm in the scenario's trigger.sh
# actions[].style   danger | default | info  (button color in the UI)
# actions[].confirm true  -> UI shows a confirm() dialog and the backend
#                            requires ?confirm=true before running it
# actions[].active  true  -> running this verb marks the scenario "active"
#                            in the scenario-runner's in-memory tracker
#                   false -> running this verb clears "active" for the
#                            scenario (used as the Active Scenarios "stop"
#                            action). Omit for verbs that don't affect
#                            tracked state (status, fire-and-forget bursts).
# group             scenario name (Confluence "MVP Demo Scenarios
#                   (Merged Groupings)" page) — entries sharing a group are
#                   rendered together under one heading in index.html.
# act               integer, this entry's Act number within its group —
#                   entries are ordered by this within a group's section.
#                   Omitted for single-entry scenarios that have no Acts
#                   (e.g. Workload Right-Sizing) — those render in their own single-entry
#                   "group" so the UI's grouping logic has one consistent
#                   shape to iterate.

- id: database-performance-matrix/act-1-resource-starvation
