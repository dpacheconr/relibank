- id: gitops-failure
  title: "GitOps Failure"
  description: "Bumps support_service to a CVE-pinned dependency and force-merges past the NR tag-compliance CI gate, dropping the Scorecard. Triggered via GitHub Actions workflow_dispatch (.github/workflows/gitops-failure.yml) — scenario-runner lacks gh/terraform."
  dir: gitops-failure
  cloud: any
  group: "GitOps Failure"
  actions:
    # NOTE: Actions moved to .github/workflows/gitops-failure.yml workflow_dispatch
    # Scenario-runner pod lacks gh (GitHub CLI) and terraform; use GitHub Actions workflow:
    #   gh workflow run gitops-failure.yml -f action=<verb> [-f base_branch=<branch>]
    - {verb: create-pr, label: "[GH Actions] Create Non-Compliant PR", style: default, active: true}
    - {verb: merge, label: "[GH Actions] Force-Merge PR", style: danger, confirm: true}
    - {verb: cve-only, label: "[GH Actions] CVE-Only (no PR)", style: danger, confirm: true}
    - {verb: cve-restore, label: "[GH Actions] Restore Safe Dependency", style: default}
    - {verb: status, label: "[GH Actions] Status", style: info}
    - {verb: rollback, label: "[GH Actions] Rollback", style: default, active: false}

