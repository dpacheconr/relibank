  dir: database-performance-matrix/act-1-resource-starvation
  cloud: any
  group: "Database Performance Matrix"
  act: 1
  actions:
    - {verb: start, label: "Start Outage", style: danger, confirm: true, active: true}
    - {verb: stop, label: "Stop Outage", style: default, active: false}
    - {verb: status, label: "Status", style: info}

