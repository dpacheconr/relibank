name: GitOps Failure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        required: true
        options:
          - create-pr
          - merge
          - rollback
          - cve-only
          - cve-restore
          - status
      base_branch:
        description: "Target branch for the PR (default: repository default branch)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  gitops-failure:
    name: GitOps Failure - ${{ inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine base branch
        id: base-branch
        run: |
          if [[ -n "${{ inputs.base_branch }}" ]]; then
            BASE_BRANCH="${{ inputs.base_branch }}"
          else
            BASE_BRANCH="${{ github.event.repository.default_branch }}"
          fi
          echo "branch=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform variables
        env:
          NR_ACCOUNT_ID: ${{ vars.NR_ACCOUNT_ID }}
          NR_USER_API_KEY: ${{ secrets.NR_USER_API_KEY }}
          NR_REGION: ${{ vars.NR_REGION || 'US' }}
        run: |
          {
            echo "TF_VAR_account_id=${NR_ACCOUNT_ID}"
            echo "TF_VAR_new_relic_api_key=${NR_USER_API_KEY}"
            echo "TF_VAR_new_relic_region=${NR_REGION}"
          } >> "$GITHUB_ENV"

      - name: Set up constants
        env:
          BASE_BRANCH: ${{ steps.base-branch.outputs.branch }}
        run: |
          DEMO_BRANCH="demo/gitops-failure-bad-pr"
          SCRIPT_DIR="demo_flows/gitops-failure"
          REPO_ROOT="${PWD}"
          {
            echo "DEMO_BRANCH=${DEMO_BRANCH}"
            echo "SCRIPT_DIR=${SCRIPT_DIR}"
            echo "REPO_ROOT=${REPO_ROOT}"
            echo "BASE_BRANCH=${BASE_BRANCH}"
          } >> "$GITHUB_ENV"

      - name: Create PR (create-pr)
        if: inputs.action == 'create-pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Creating demo branch: ${DEMO_BRANCH} ==="
          git checkout -b "${DEMO_BRANCH}"

          echo "=== Installing CVE requirements ==="
          cp "${SCRIPT_DIR}/requirements-with-cve.txt" support_service/requirements.txt

          echo "=== Committing ==="
          git add support_service/requirements.txt
          git commit -m "feat: bump payment-gateway-service dep [DEMO — CVE dep]"
          git push origin "${DEMO_BRANCH}"

          echo "=== Opening PR ==="
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --title "Bump support_service dependency [DEMO]" \
            --body "Demo scenario — shift-left CVE gate. Targets ${{ env.BASE_BRANCH }}, never main." \
            --base "${{ env.BASE_BRANCH }}" \
            --head "${DEMO_BRANCH}" \
            --web=false 2>&1)

          # Extract PR number from URL or output
          PR_NUM=$(echo "$PR_URL" | grep -oP 'pull/\K[0-9]+' || gh pr list --head "${DEMO_BRANCH}" --json number -q '.[0].number')
          echo "PR_NUMBER=${PR_NUM}" >> "$GITHUB_ENV"

          echo ""
          echo "PR #${PR_NUM} is open. It adds CVE-pinned dependency changes."
          echo "To proceed to merge: gh workflow run gitops-failure.yml -f action=merge -f base_branch=${{ env.BASE_BRANCH }}"

      - name: Merge PR (merge)
        if: inputs.action == 'merge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Fetching latest refs ==="
          git fetch origin

          echo "=== Force-merging PR (bypassing branch protection) ==="
          gh pr merge --squash --admin "${DEMO_BRANCH}" \
            --repo "${{ github.repository }}"

          echo ""
          echo "=== Applying Terraform to create mis-tagged NR resource ==="
          cd terraform/newrelic/relibank
          terraform init -upgrade
          terraform apply -auto-approve

          echo ""
          echo "Allow 2-3 minutes for the Scorecard to update."
          echo "To restore: gh workflow run gitops-failure.yml -f action=rollback -f base_branch=${{ env.BASE_BRANCH }}"

      - name: Rollback (rollback)
        if: inputs.action == 'rollback'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Fetching latest refs ==="
          git fetch origin

          echo "=== Reverting on ${{ env.BASE_BRANCH }} ==="
          git checkout "${{ env.BASE_BRANCH }}"

          # Find the exact merge commit SHA from the merged PR (--squash creates non-merge commit)
          # Use gh pr list to get the mergeCommit.oid from the last merged PR on this branch
          MERGE_SHA=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state merged \
            --head "${DEMO_BRANCH}" \
            --json number,mergeCommit \
            --jq '.[0].mergeCommit.oid' 2>/dev/null || echo "")

          if [[ -z "${MERGE_SHA}" ]]; then
            echo "ERROR: Could not find merged PR for branch ${DEMO_BRANCH}"
            echo "  PR may have already been deleted or merge failed to complete."
            exit 1
          fi

          echo "Found merge commit: ${MERGE_SHA}"

          # Determine if this is a merge commit (2 parents) or squash commit (1 parent)
          PARENT_COUNT=$(git cat-file -p "${MERGE_SHA}" | grep -c '^parent' || echo "0")
          REVERT_ARGS=""
          if [[ "${PARENT_COUNT}" -eq 2 ]]; then
            echo "  (Merge commit detected, using -m 1)"
            REVERT_ARGS="-m 1"
          fi

          echo "Reverting commit: ${MERGE_SHA}"
          # shellcheck disable=SC2086
          git revert --no-edit ${REVERT_ARGS} "${MERGE_SHA}"
          git push origin "${{ env.BASE_BRANCH }}"

          echo "=== Restoring requirements.txt ==="
          git checkout HEAD -- support_service/requirements.txt

          echo "=== Applying Terraform to destroy mis-tagged resource ==="
          cd terraform/newrelic/relibank
          terraform init -upgrade
          terraform apply -auto-approve

          echo "=== Cleaning up branch ==="
          git branch -D "${DEMO_BRANCH}" 2>/dev/null || true
          git push origin --delete "${DEMO_BRANCH}" 2>/dev/null || true

          echo ""
          echo "Done. Scorecard should recover within ~2 minutes."

      - name: CVE-only (cve-only)
        if: inputs.action == 'cve-only'
        run: |
          set -euo pipefail

          echo "=== Installing CVE requirements (S8 surface) ==="
          cp "${SCRIPT_DIR}/requirements-with-cve.txt" support_service/requirements.txt
          echo "Done. requirements.txt now contains requests==2.18.0"
          echo "To restore: gh workflow run gitops-failure.yml -f action=cve-restore"

      - name: Restore CVE (cve-restore)
        if: inputs.action == 'cve-restore'
        run: |
          set -euo pipefail

          echo "=== Restoring requirements.txt ==="
          git checkout HEAD -- support_service/requirements.txt
          echo "Done."

      - name: Status (status)
        if: inputs.action == 'status'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Current Branch ==="
          git branch --show-current

          echo ""
          echo "=== Demo Branch State ==="
          if git show-ref "refs/remotes/origin/${DEMO_BRANCH}" >/dev/null 2>&1; then
            echo "Remote branch exists"
          else
            echo "Remote branch not found"
          fi

          echo ""
          echo "=== Open PRs ==="
          gh pr list --head "${DEMO_BRANCH}" --repo "${{ github.repository }}" || \
            echo "No open PRs for ${DEMO_BRANCH}"
